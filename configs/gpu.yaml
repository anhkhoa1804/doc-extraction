# GPU profile — WIRED AND MEASURED. Requires a CUDA-capable torch build.
#
# `device: cuda` here now reaches every model stage:
#   * docling layout + TableFormer + EasyOCR, via
#     `PdfPipelineOptions.accelerator_options` (backends/docling_backend.py)
#   * the Table Transformer detection/structure models AND their input
#     tensors (backends/table_backend.py)
#
# Both were real bugs before: docling's accelerator options were never set,
# so it fell back to its own `device="auto"` and silently disagreed with
# this file, while EasyOCR was pinned to CPU by the deprecated `use_gpu`
# flag; and the Table Transformer backend moved its models to the device
# but not its inputs, which raises "Expected all tensors to be on the same
# device" the moment device is not cpu.
#
# VALIDATED as of 2026-09-01 on an NVIDIA L4 (driver 580.173.02, torch
# 2.11.0+cu128): both Table Transformer checkpoints and their input tensors
# were observed on cuda:0, output was byte-identical to CPU (0.000 px bbox
# delta), and warm layout inference was 8.9x faster than CPU. See
# experiments/006_linux_gpu_validation/.
#
# Note the cold/warm distinction before quoting any speedup: on a short run
# model loading dominates, and wall-clock speedup (1.4x) understates
# steady-state inference (8.9x) by roughly 6x. `scripts/profile_pipeline.py`
# separates them.
#
# On a SHARED machine prefer `device: auto` over `cuda`: it inspects free
# VRAM, utilization and other compute processes first, and falls back to CPU
# rather than competing with another project's job. `cuda` here is
# unconditional and will happily contend.
#
# Verify the machine can actually do CUDA work before using this:
#
#     python -c "import torch; print(torch.cuda.is_available())"
#
# If that prints False, use configs/cpu.yaml. See docs/backends.md.

input_dir: "data"       # local/private sample documents; see data/README.md
output_dir: "outputs"
device: "cuda"   # validated; prefer "auto" on a shared machine — see header

render_dpi: 200

# --- PDF routing: quantity gate ---
digital_pdf_min_chars_per_page: 40
digital_pdf_page_ratio: 0.6
digital_pdf_sample_pages: 5

# --- PDF routing: quality gate (ingest/text_quality.py) ---
# Detects a text layer that is present but wrongly decoded (broken font
# CMap). Thresholds calibrated on this repo's corpus: 22 clean pages scored
# 0.000 on mixed_script_word_ratio, the 2 corrupt pages scored 0.400-0.538.
# Re-calibrate with scripts/calibrate_text_quality.py for a different corpus.
text_quality_min_chars: 200
text_quality_max_mixed_script_word_ratio: 0.10
text_quality_max_unexpected_script_ratio: 0.10
text_quality_max_replacement_ratio: 0.02
text_quality_max_control_ratio: 0.02
text_quality_min_alpha_ratio: 0.30
text_quality_max_digit_in_word_ratio: 0.30
text_quality_expected_scripts: ["LATIN"]   # covers English and Vietnamese
text_quality_max_suspicious_page_ratio: 0.34
digital_pdf_page_fallback: true            # re-extract only the bad pages

# --- Tables ---
digital_pdf_tables: true   # PyMuPDF native table finder; no render, no OCR

# Sample documents are mixed Vietnamese/English.
ocr_languages: ["en", "vi"]

layout_backend: "docling"
ocr_backend: "docling"
table_backend: "table_transformer"

backends:
  docling: true       # installed and validated on CPU
  mineru: false       # not installed — see docs/backends.md
  paddleocr: false    # not installed — see docs/backends.md
  vlm: false          # not implemented — see docs/backends.md

cache_dir: ".cache"   # relative: resolved against the repo root
log_level: "INFO"
